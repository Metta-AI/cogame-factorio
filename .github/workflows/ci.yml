name: CI

# Test + package-smoke every push/PR, and — on main only, AFTER both jobs
# are green — build and upload a new "factorio" version to Softmax.
# (Shape copied from cogame-moba; see its header comment for the rationale
# of gating the upload on the test jobs inside one workflow.)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version for the Coworld upload (default: bump patch of latest uploaded factorio)"
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The viewer is Nim -> emscripten. Build it in the SAME pinned
      # toolchain container the image uses (Dockerfile wasm-builder stage:
      # emsdk 4.0.15 + nimby 0.1.27 + Nim 2.2.4 + nimby.lock), mirroring
      # coworld-ctf's wasm-replay-viewer job, then copy viewer/dist out so
      # tests/test_viewer.py smoke-runs the exact emitted module under node.
      - uses: docker/setup-buildx-action@v3
      - name: Build wasm replay viewer (Dockerfile wasm-builder stage)
        run: |
          bash tools/build_replay_viewer.sh "$PWD/build/static-replay-viewer"
          mkdir -p viewer/dist
          cp -r build/static-replay-viewer/. viewer/dist/
      - name: Sync Python deps
        run: uv sync --frozen
      - name: Run tests
        env:
          COGAME_REQUIRE_WASM_BUILD: "1"
        run: uv run pytest -v -m "not factorio"

  # Packaging smoke: the production image builds and a containerized
  # episode (real Factorio headless servers inside the game container)
  # completes with results + replay.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --platform=linux/amd64 -t cogame-factorio:ci .
      - name: Raw-Docker episode smoke
        run: bash tools/ci/docker_smoke.sh cogame-factorio:ci

  upload-coworld:
    runs-on: ubuntu-latest
    needs: [test, docker-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: upload-coworld
      cancel-in-progress: false
    env:
      HAVE_SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN != '' }}
    steps:
      - name: Check upload credential
        env:
          UPLOAD_REQUIRED: ${{ vars.UPLOAD_REQUIRED }}
        run: |
          if [ "$HAVE_SOFTMAX_TOKEN" != "true" ]; then
            if [ "$UPLOAD_REQUIRED" = "true" ]; then
              echo "::error::SOFTMAX_TOKEN secret is not set but UPLOAD_REQUIRED is true."
              exit 1
            fi
            echo "::warning::SOFTMAX_TOKEN secret is not set; skipping the Coworld upload."
          fi
      - uses: actions/checkout@v5
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        with:
          path: cogame-factorio
      - uses: astral-sh/setup-uv@v6
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
      - name: Authenticate to Softmax
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: uvx --from "coworld[auth]==0.1.43" softmax set-token "$SOFTMAX_TOKEN"
      - name: Determine version
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        id: version
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 cogame-factorio/tools/ci/test_next_coworld_version.py
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(python3 cogame-factorio/tools/ci/next_coworld_version.py factorio)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version '$version' (expected MAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "Uploading as factorio $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build, certify, and upload
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        working-directory: cogame-factorio
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uvx --from "coworld[auth]==0.1.43" coworld build \
            --version "$VERSION" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest_template.json \
            --output dist/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.43" coworld upload-coworld \
            dist/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      - name: Verify upload
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uvx --from "coworld[auth]==0.1.43" coworld list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "$VERSION" <<'PY'
          import json, sys
          expected = sys.argv[1]
          rows = json.load(open("/tmp/coworlds-after.json"))
          match = [r for r in rows if r.get("name") == "factorio" and r.get("version") == expected]
          if not match:
              raise SystemExit(f"uploaded factorio version {expected} not found on server")
          entry = match[0]
          if not entry.get("canonical"):
              raise SystemExit(f"factorio:{expected} uploaded but is not canonical; hosted smoke likely failed.")
          print(entry["id"], entry["name"], entry["version"], "canonical")
          PY
